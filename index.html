<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開源即時通訊工具索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f;
    --surface: #141418;
    --surface2: #1c1c22;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #e8e6e0;
    --muted: #7a7870;
    --accent: #c8f060;
    --accent2: #60d4f0;
    --accent3: #f0a060;
    --us: #60a8f0;
    --uk: #78d48c;
    --ch: #f0c060;
    --br: #f08060;
    --ca: #c060f0;
    --de: #f06080;
    --fr: #60c8f0;
    --int: #a0a090;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --radius: 12px;
    --radius-sm: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: .4;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    padding: 5rem 2rem 3.5rem;
    text-align: center;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    top: -120px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(200,240,96,.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-family: var(--font-head);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .hero h1 {
    font-family: var(--font-head);
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -.02em;
    margin-bottom: 1rem;
  }
  .hero h1 span { color: var(--accent); }
  .hero-sub {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    max-width: 480px;
    margin: 0 auto 2.5rem;
  }
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-n {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    display: block;
    line-height: 1;
  }
  .stat-l { font-size: 12px; color: var(--muted); letter-spacing: .05em; }

  /* ── CONTROLS ── */
  .controls {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,12,15,.88);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
  }
  .controls-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 16px;
  }
  #search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 9px 12px 9px 36px;
    outline: none;
    transition: border-color .2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent); }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: var(--font-body);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c0c0f;
    font-weight: 500;
  }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    gap: 2px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .view-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 14px;
    transition: all .15s;
    line-height: 1;
  }
  .view-btn.active { background: var(--surface); color: var(--text); }

  /* ── MAIN ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 2.5rem 0 1rem;
  }
  .section-title {
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-count {
    font-size: 11px;
    color: var(--muted);
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .grid.list-view {
    grid-template-columns: 1fr;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color .2s, transform .15s, box-shadow .2s;
    animation: fadeUp .4s ease both;
  }
  .card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .card.expanded { border-color: rgba(200,240,96,.25); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-main {
    padding: 1.1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-name {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.01em;
  }
  .country-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 99px;
    font-weight: 500;
    white-space: nowrap;
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    font-weight: 300;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 400;
  }
  .tag.enc  { border-color: rgba(96,212,240,.25); color: var(--accent2); }
  .tag.p2p  { border-color: rgba(200,240,96,.25); color: var(--accent); }
  .tag.xmpp { border-color: rgba(240,160,96,.25); color: var(--accent3); }
  .tag.mat  { border-color: rgba(96,168,240,.25); color: var(--us); }

  .expand-icon {
    color: var(--muted);
    font-size: 14px;
    transition: transform .25s;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .card.expanded .expand-icon { transform: rotate(180deg); }

  /* ── EXPANDED PANEL ── */
  .card-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .card-detail.open { max-height: 400px; }
  .card-detail-inner {
    border-top: 1px solid var(--border);
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .detail-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 8px;
    font-size: 13px;
  }
  .detail-label { color: var(--muted); font-weight: 300; }
  .detail-val { color: var(--text); }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid rgba(200,240,96,.25);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    transition: all .15s;
    width: fit-content;
  }
  .card-link:hover {
    background: rgba(200,240,96,.08);
    border-color: rgba(200,240,96,.5);
  }

  /* ── COUNTRY COLORS ── */
  .c-us  { background: rgba(96,168,240,.12); color: #88c4ff; border: 1px solid rgba(96,168,240,.2); }
  .c-uk  { background: rgba(120,212,140,.12); color: #8adfa0; border: 1px solid rgba(120,212,140,.2); }
  .c-ch  { background: rgba(240,192,96,.12); color: #f5d080; border: 1px solid rgba(240,192,96,.2); }
  .c-br  { background: rgba(240,128,96,.12); color: #f5a080; border: 1px solid rgba(240,128,96,.2); }
  .c-ca  { background: rgba(192,96,240,.12); color: #d490ff; border: 1px solid rgba(192,96,240,.2); }
  .c-de  { background: rgba(240,96,128,.12); color: #f590a8; border: 1px solid rgba(240,96,128,.2); }
  .c-fr  { background: rgba(96,200,240,.12); color: #80d8ff; border: 1px solid rgba(96,200,240,.2); }
  .c-int { background: rgba(160,160,144,.10); color: #b0b0a0; border: 1px solid rgba(160,160,144,.2); }

  /* ── NO RESULTS ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
  }
  footer a { color: var(--muted); }
  footer strong { color: var(--text); }

  /* ── LIST VIEW OVERRIDES ── */
  .list-view .card-main {
    flex-direction: row;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
  }
  .list-view .card-top { flex: 1; min-width: 200px; }
  .list-view .card-desc { flex: 2; min-width: 240px; font-size: 13px; }
  .list-view .tags { flex: 1; min-width: 160px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .hero { padding: 3rem 1.25rem 2rem; }
    .controls { padding: .75rem 1.25rem; }
    main { padding: 1.5rem 1.25rem 3rem; }
    .grid { grid-template-columns: 1fr; }
    .filter-btn { font-size: 11px; padding: 5px 10px; }
  }
</style>
</head>

</div>

<main>

const CAT_LABELS = {
  privacy: '🔒 個人通訊 · 隱私導向',
  team:    '🏢 團隊協作 · 企業自架',
  protocol:'📡 開放協議 · 標準與伺服器',
  voip:    '📞 VoIP · 多媒體通訊'
};

let activeCat = 'all';
let activeCountry = null;
let expandedId = null;
let isListView = false;

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const container = document.getElementById('sections-container');
  container.innerHTML = '';

  const cats = activeCat === 'all' ? ['privacy','team','protocol','voip'] : [activeCat];
  let total = 0;

  cats.forEach(cat => {
    const items = DATA.filter(d => {
      if (d.cat !== cat) return false;
      if (activeCountry && d.country !== activeCountry) return false;
      if (q) {
        const haystack = [d.name, d.desc, d.detail, d.countryName,
          ...d.tags.map(t=>t[0])].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    if (!items.length) return;
    total += items.length;

    const section = document.createElement('div');
    section.innerHTML = `
      <div class="section-header">
        <span class="section-title">${CAT_LABELS[cat]}</span>
        <div class="section-line"></div>
        <span class="section-count">${items.length} 項</span>
      </div>`;

    const grid = document.createElement('div');
    grid.className = isListView ? 'grid list-view' : 'grid';

    items.forEach((d, i) => {
      const card = document.createElement('div');
      card.className = 'card' + (expandedId === d.id ? ' expanded' : '');
      card.style.animationDelay = (i * 0.04) + 's';
      card.dataset.id = d.id;
      card.innerHTML = `
        <div class="card-main">
          <div class="card-top">
            <div class="card-name-row">
              <span class="card-name">${d.name}</span>
              <span class="country-badge ${d.countryClass}">${d.country} ${d.countryName}</span>
            </div>
            <span class="expand-icon">▾</span>
          </div>
          <p class="card-desc">${d.desc}</p>
          <div class="tags">${d.tags.map(([t,c])=>`<span class="tag ${c}">${t}</span>`).join('')}</div>
        </div>
        <div class="card-detail${expandedId === d.id ? ' open' : ''}">
          <div class="card-detail-inner">
            <p style="font-size:13px;color:var(--text);line-height:1.6;font-weight:300;">${d.detail}</p>
            <div>
              <div class="detail-row"><span class="detail-label">授權</span><span class="detail-val">${d.license}</span></div>
              <div class="detail-row"><span class="detail-label">語言</span><span class="detail-val">${d.lang}</span></div>
              <div class="detail-row"><span class="detail-label">GitHub ★</span><span class="detail-val">${d.stars}</span></div>
              <div class="detail-row"><span class="detail-label">創立</span><span class="detail-val">${d.founded}</span></div>
            </div>
            <a class="card-link" href="${d.github}" target="_blank" rel="noopener">
              ↗ 前往 GitHub / 原始碼
            </a>
          </div>
        </div>`;
      card.addEventListener('click', () => toggleCard(d.id));
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  document.getElementById('total-count').textContent = DATA.length;

  if (total === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div class="empty-icon">⊘</div><p>沒有符合條件的工具</p>';
    container.appendChild(empty);
  }
}

function toggleCard(id) {
  expandedId = expandedId === id ? null : id;
  render();
  if (expandedId) {
    setTimeout(() => {
      const el = document.querySelector(`[data-id="${expandedId}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

// Category filters
document.getElementById('cat-filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('#cat-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  expandedId = null;
  render();
});

// Country filters
document.getElementById('country-filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const c = btn.dataset.country;
  if (activeCountry === c) {
    activeCountry = null;
    btn.classList.remove('active');
  } else {
    document.querySelectorAll('#country-filters .filter-btn').forEach(b => b.classList.remove('active'));
    activeCountry = c;
    btn.classList.add('active');
  }
  expandedId = null;
  render();
});

// Search
let searchTimer;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { expandedId = null; render(); }, 180);
});

// View toggle
document.getElementById('grid-btn').addEventListener('click', () => {
  isListView = false;
  document.getElementById('grid-btn').classList.add('active');
  document.getElementById('list-btn').classList.remove('active');
  render();
});
document.getElementById('list-btn').addEventListener('click', () => {
  isListView = true;
  document.getElementById('list-btn').classList.add('active');
  document.getElementById('grid-btn').classList.remove('active');
  render();
});

render();
</script>
